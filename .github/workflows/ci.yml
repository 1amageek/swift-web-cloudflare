name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck every Deployment component and unit-test the actor-enabled one.
  # The Swift/WASM host build is owned by the adapter manifest.
  # This job validates the Worker boundary independently of the Swift toolchain.
  worker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [workers, page-worker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize the application template
        run: |
          work="$RUNNER_TEMP/${{ matrix.component }}"
          mkdir -p "$work"
          cp -R Adapter/Templates/Deployment/common/. "$work"
          cp -R "Adapter/Templates/Deployment/${{ matrix.component }}/." "$work"
          find "$work" -type f \( -name '*.json' -o -name '*.jsonc' -o -name '*.ts' \) \
            -exec sed -i 's/{{application.kebabName}}/ci-app/g' {} +

      - name: Validate adapter manifest
        run: jq empty Adapter/sweb.json

      - name: Install
        working-directory: ${{ runner.temp }}/${{ matrix.component }}
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ runner.temp }}/${{ matrix.component }}
        run: npm run typecheck

      - name: Test (auth claim logic)
        if: matrix.component == 'workers'
        working-directory: ${{ runner.temp }}/${{ matrix.component }}
        run: npm test
