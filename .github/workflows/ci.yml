name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck and unit-test the Worker host that ships in the deploy scaffold.
  # The Swift/WASM host build remains available through deploy/wasm/build.sh.
  # This job validates the Worker boundary independently of the Swift toolchain.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize the application template
        run: |
          src="Sources/swiftweb-cloudflare/Templates/application/deploy/cloudflare"
          work="$RUNNER_TEMP/worker"
          cp -R "$src" "$work"
          find "$work" -type f \( -name '*.json' -o -name '*.jsonc' -o -name '*.ts' \) \
            -exec sed -i 's/{{app.kebabName}}/ci-app/g; s/{{app.name}}/CIApp/g; s/{{app.packageName}}/CIApp/g' {} +

      - name: Install
        working-directory: ${{ runner.temp }}/worker
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ runner.temp }}/worker
        run: npm run typecheck

      - name: Test (auth claim logic)
        working-directory: ${{ runner.temp }}/worker
        run: npm test
